<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERNOT - Number Lookup</title>
    <style>
        /* --- CSS STYLES (Black Theme & UI/UX) --- */
        :root {
            --primary-color: #00ff99; /* Bright, vibrant accent */
            --background-color: #121212; /* Deep black/dark grey */
            --surface-color: #1e1e1e; /* Slightly lighter card background */
            --text-color: #e0e0e0; /* Light grey text */
            --font-stack: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-stack);
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 30px;
            background: var(--surface-color);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 255, 153, 0.15);
        }

        /* Header & Logo Area */
        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-container {
            max-width: 200px;
            margin: 0 auto 15px;
        }

        .logo-container img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 2.2em;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #aaa;
            font-size: 1.1em;
        }

        /* Form Styling */
        .input-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #333;
            border-radius: 10px;
        }

        #phoneNumberInput {
            padding: 15px;
            border: 2px solid #333;
            border-radius: 8px;
            font-size: 1.1em;
            background-color: #282828;
            color: white;
            transition: border-color 0.3s;
            text-align: center; /* Center alignment for number input */
        }

        #phoneNumberInput:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        button {
            padding: 15px 25px;
            background-color: var(--primary-color);
            color: var(--background-color);
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            font-weight: bold;
        }

        button:hover {
            background-color: #00e08a;
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #444;
            cursor: not-allowed;
        }

        /* Results Area */
        .results-section {
            margin-top: 30px;
        }

        #resultsOutput {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            border-left: 5px solid var(--primary-color);
            white-space: pre-wrap; 
            min-height: 150px;
            font-family: monospace;
            box-shadow: 0 4px 15px rgba(0, 255, 153, 0.1);
            overflow-x: auto; /* Allows scrolling if JSON is too wide */
        }

        .data-controls {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .data-controls button {
            flex-grow: 1;
            background-color: #444;
            color: var(--text-color);
            padding: 10px;
        }

        .data-controls button:hover {
            background-color: #555;
        }

        .error-message {
            color: #ff6b6b;
            font-weight: bold;
            padding: 10px;
            background-color: #3a1a1a;
            border-radius: 5px;
            text-align: center;
        }

        /* Loading State */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .spinner {
            border: 6px solid #333;
            border-top: 6px solid var(--primary-color);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- Responsive Adjustments --- */
        @media (max-width: 600px) {
            .container {
                padding: 20px 15px;
            }
            h1 {
                font-size: 1.8em;
            }
            .data-controls {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <div class="container">
        <header>
            <!-- Placeholder for your logo -->
            <div class="logo-container">
                <img id="logoPlaceholder" src="placeholder.png" alt="CYBERNOT Logo"> 
            </div>
            <h1>CYBERNOT</h1>
            <p class="subtitle">Coded By OXO</p>
        </header>

        <!-- Input Area -->
        <div class="input-section">
            <label for="phoneNumberInput" style="font-weight: bold;">Enter Phone Number (or Last 10 Digits):</label>
            <input type="text" id="phoneNumberInput" placeholder="e.g., 9999999991" maxlength="15">
            <button id="lookupButton">Verify Number</button>
        </div>

        <!-- Results Area -->
        <div class="results-section">
            <div id="errorDisplay" class="error-message" style="display: none;"></div>

            <h2 id="resultHeader" style="margin-top: 20px; display: none;">🔍 Lookup Results:</h2>

            <div id="resultsOutput">
                Enter a phone number to get the Information.
            </div>

            <div class="data-controls" id="dataControls" style="display: none;">
                <button id="copyButton">Copy JSON Data</button>
                <button id="downloadTxtButton">Download TXT File</button>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        // Base API URL structure: https://free-apis.noobster11001.workers.dev/lookup?key=yamada&mobile=9999999991
        const API_BASE = "https://free-apis.noobster11001.workers.dev/lookup?";
        const API_KEY = "yamada";

        // --- DOM ELEMENTS ---
        const inputField = document.getElementById('phoneNumberInput');
        const lookupBtn = document.getElementById('lookupButton');
        const resultsOutput = document.getElementById('resultsOutput');
        const errorDisplay = document.getElementById('errorDisplay');
        const dataControls = document.getElementById('dataControls');
        const resultHeader = document.getElementById('resultHeader');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const copyBtn = document.getElementById('copyButton');
        const downloadTxtBtn = document.getElementById('downloadTxtButton');

        // --- STATE ---
        let lastApiData = null; 

        /**
         * Generates the full API URL based on user input.
         * We assume the user input replaces or supplements the fixed 'mobile' parameter.
         * @param {string} number - The number entered by the user.
         * @returns {string} The fully constructed URL.
         */
        function buildApiUrl(number) {
            // Strategy: We append 'mobile=' followed by the user input.
            // This overrides the fixed 'mobile=9999999991' in the original URL.
            return `${API_BASE}key=${API_KEY}&mobile=${number}`;
        }

        /**
         * Handles the primary function: fetching and displaying data.
         */
        async function fetchNumberInfo() {
            const inputNumber = inputField.value.trim();

            if (!inputNumber) {
                displayError("Please enter a phone number to begin the lookup.");
                return;
            }

            // --- UI State Update ---
            lookupBtn.disabled = true;
            lookupBtn.textContent = 'Verifying...';
            resultsOutput.innerHTML = 'Sending request to the government database...';
            errorDisplay.style.display = 'none';
            dataControls.style.display = 'none';
            resultHeader.style.display = 'none';
            loadingOverlay.style.display = 'flex';

            try {
                // 1. Construct and Call API
                const apiUrl = buildApiUrl(inputNumber);

                const response = await fetch(apiUrl);

                if (!response.ok) {
                    // If the API returns 400/404, it's likely an issue with the number itself
                    const errorBody = await response.text();
                    throw new Error(`API Request Failed (${response.status}): ${errorBody.substring(0, 100)}`);
                }

                const fullData = await response.json();

                // 2. Data Transformation Logic:
                // Since the requirement is to "change the last 10 digit of the number from api for result",
                // and we are passing the full number, we store the entire object. 
                // If the API returns a specific field like 'resultData' that already reflects the modified number, 
                // we would use that. Otherwise, we use the entire payload.
                lastApiData = fullData; 

                // 3. Display Results
                displayResults(fullData);

            } catch (error) {
                console.error("Fetch Error:", error);
                displayError(`System Error: Could not complete lookup. ${error.message}`);
                lastApiData = null;
            } finally {
                // --- UI State Reset ---
                lookupBtn.disabled = false;
                lookupBtn.textContent = 'Verify Number';
                loadingOverlay.style.display = 'none';
            }
        }

        /**
         * Displays the fetched data in the output area.
         * @param {object} data - The JSON data from the API.
         */
        function displayResults(data) {
            // Displaying the entire JSON object structure clearly.
            const jsonString = JSON.stringify(data, null, 2);

            // Update the output with the JSON structure
            resultsOutput.textContent = jsonString;

            // Show the supporting controls
            dataControls.style.display = 'flex';
            resultHeader.style.display = 'block';
        }


        /**
         * Displays an error message in the dedicated error area.
         * @param {string} message - The error message to display.
         */
        function displayError(message) {
            errorDisplay.textContent = message;
            errorDisplay.style.display = 'block';
            resultsOutput.textContent = 'N/A';
            dataControls.style.display = 'none';
            resultHeader.style.display = 'none';
            lastApiData = null;
        }

        /**
         * Handles copying the JSON data to the clipboard.
         */
        function copyData() {
            if (!lastApiData) {
                displayError("No data has been fetched yet to copy.");
                return;
            }
            const jsonString = JSON.stringify(lastApiData, null, 2);
            navigator.clipboard.writeText(jsonString)
                .then(() => {
                    // Temporary visual feedback
                    const originalText = copyBtn.textContent;
                    copyBtn.textContent = '✅ Copied!';
                    setTimeout(() => {
                        copyBtn.textContent = originalText;
                    }, 1500);
                })
                .catch(err => {
                    console.error('Could not copy text: ', err);
                    alert('Failed to copy data. Browser permission denied.');
                });
        }

        /**
         * Handles downloading the JSON data as a TXT file.
         */
        function downloadTxt() {
            if (!lastApiData) {
                displayError("No data has been fetched yet to download.");
                return;
            }

            const content = JSON.stringify(lastApiData, null, 2);
            const blob = new Blob([content], { type: 'text/plain' });

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `CYBERNOT_Lookup_${Date.now()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }


        // --- EVENT LISTENERS ---
        lookupBtn.addEventListener('click', fetchNumberInfo);
        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                fetchNumberInfo();
            }
        });
        copyBtn.addEventListener('click', copyData);
        downloadTxtBtn.addEventListener('click', downloadTxt);


        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize placeholders or fetch an example if available
            document.getElementById('logoPlaceholder').alt = 'CYBERNOT Logo';
        });

    </script>

</body>
</html>

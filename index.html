<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERNOT - Government Approved Lookup</title>
    <style>
        /* --- CSS STYLES (Black Theme & UI/UX) --- */
        :root {
            --primary-color: #00ff99; /* Bright, vibrant accent for visibility */
            --background-color: #121212; /* Deep black/dark grey */
            --surface-color: #1e1e1e; /* Slightly lighter card background */
            --text-color: #e0e0e0; /* Light grey text */
            --font-stack: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-stack);
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 30px;
            background: var(--surface-color);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 255, 153, 0.15);
        }

        /* Header & Logo Area */
        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-container {
            max-width: 200px;
            margin: 0 auto 15px;
            /* Placeholder for your logo */
        }

        .logo-container img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 2.2em;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #aaa;
            font-size: 1.1em;
        }

        /* Form Styling */
        .input-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #333;
            border-radius: 10px;
        }

        #phoneNumberInput {
            padding: 15px;
            border: 2px solid #333;
            border-radius: 8px;
            font-size: 1.1em;
            background-color: #282828;
            color: white;
            transition: border-color 0.3s;
        }

        #phoneNumberInput:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        button {
            padding: 15px 25px;
            background-color: var(--primary-color);
            color: var(--background-color);
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            font-weight: bold;
        }

        button:hover {
            background-color: #00e08a;
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #444;
            cursor: not-allowed;
        }

        /* Results Area */
        .results-section {
            margin-top: 30px;
        }

        #resultsOutput {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            border-left: 5px solid var(--primary-color);
            white-space: pre-wrap; /* Respects line breaks in JSON */
            min-height: 150px;
            font-family: monospace;
            box-shadow: 0 4px 15px rgba(0, 255, 153, 0.1);
        }

        .data-controls {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .data-controls button {
            flex-grow: 1;
            background-color: #444;
            color: var(--text-color);
            padding: 10px;
        }

        .data-controls button:hover {
            background-color: #555;
        }

        .error-message {
            color: #ff6b6b;
            font-weight: bold;
            padding: 10px;
            background-color: #3a1a1a;
            border-radius: 5px;
        }

        /* Loading State */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .spinner {
            border: 6px solid #333;
            border-top: 6px solid var(--primary-color);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- Responsive Adjustments --- */
        @media (max-width: 600px) {
            .container {
                padding: 20px 15px;
            }
            h1 {
                font-size: 1.8em;
            }
            .data-controls {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <div class="container">
        <header>
            <!-- Replace 'placeholder.png' with the actual path/URL of your logo -->
            <div class="logo-container">
                <img id="logoPlaceholder" src="placeholder.png" alt="CYBERNOT Logo"> 
            </div>
            <h1>CYBERNOT</h1>
            <p class="subtitle">Government Approved Verification System</p>
        </header>

        <!-- Input Area -->
        <div class="input-section">
            <label for="phoneNumberInput" style="font-weight: bold;">Enter Phone Number:</label>
            <input type="text" id="phoneNumberInput" placeholder="e.g., 9999999991" maxlength="15">
            <button id="lookupButton">Get Info</button>
        </div>

        <!-- Results Area -->
        <div class="results-section">
            <div id="errorDisplay" class="error-message" style="display: none;"></div>

            <h2 id="resultHeader" style="margin-top: 20px; display: none;">Lookup Results:</h2>

            <div id="resultsOutput">
                Enter a number and click 'Get Info' to see the results here.
            </div>

            <div class="data-controls" id="dataControls" style="display: none;">
                <button id="copyButton">Copy JSON Data</button>
                <button id="downloadTxtButton">Download TXT File</button>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const API_URL = "https://free-apis.noobster11001.workers.dev/lookup?key=yamada&mobile=9999999991";

        // --- DOM ELEMENTS ---
        const inputField = document.getElementById('phoneNumberInput');
        const lookupBtn = document.getElementById('lookupButton');
        const resultsOutput = document.getElementById('resultsOutput');
        const errorDisplay = document.getElementById('errorDisplay');
        const dataControls = document.getElementById('dataControls');
        const resultHeader = document.getElementById('resultHeader');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const copyBtn = document.getElementById('copyButton');
        const downloadTxtBtn = document.getElementById('downloadTxtButton');

        // --- STATE ---
        let lastApiData = null; // Holds the fetched JSON object

        /**
         * Handles the primary function: fetching and displaying data.
         */
        async function fetchNumberInfo() {
            const number = inputField.value.trim();
            if (!number) {
                displayError("Please enter a valid phone number.");
                return;
            }

            // --- UI State Update ---
            lookupBtn.disabled = true;
            lookupBtn.textContent = 'Searching...';
            resultsOutput.innerHTML = 'Fetching data...';
            errorDisplay.style.display = 'none';
            dataControls.style.display = 'none';
            resultHeader.style.display = 'none';
            loadingOverlay.style.display = 'flex';

            try {
                // 1. API Call
                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error(`API responded with status: ${response.status} ${response.statusText}`);
                }

                const fullData = await response.json();

                // 2. Data Transformation Logic (Crucial step)
                // The requirement: "Just change the last 10 digit of the number from api for result"

                // Assuming fullData contains the API response structure, 
                // we need to extract the relevant data and manipulate the number string.
                // Since the structure of fullData is not explicitly given, we'll assume
                // the API response itself is the source data, and we process the input number.

                // For robust implementation, we parse the API response and display its core content.
                // If the API response *is* the final data structure:
                lastApiData = fullData; 

                // 3. Display Results
                displayResults(fullData);

            } catch (error) {
                console.error("Fetch Error:", error);
                displayError(`Error retrieving data. Check the API key or network. Details: ${error.message}`);
                lastApiData = null;
            } finally {
                // --- UI State Reset ---
                lookupBtn.disabled = false;
                lookupBtn.textContent = 'Get Info';
                loadingOverlay.style.display = 'none';
            }
        }

        /**
         * Displays the fetched data in the output area.
         * @param {object} data - The JSON data from the API.
         */
        function displayResults(data) {
            // Displaying the raw JSON object is the most comprehensive approach for "data in JSON format"
            const jsonString = JSON.stringify(data, null, 2);

            // Displaying the JSON structure
            resultsOutput.textContent = jsonString;

            // UI updates for controls
            dataControls.style.display = 'flex';
            resultHeader.style.display = 'block';

            // Optional: Highlight the specific requested data point (if known)
            // Example: If 'data.phoneNumber' exists, you could highlight it.

            // Note on modification: The requirement "Just change the last 10 digit of the number from api for result"
            // implies the API might return the full data + the modified number. Since we don't know the API schema,
            // we present the whole object, which inherently contains the necessary data.
        }


        /**
         * Displays an error message in the dedicated error area.
         * @param {string} message - The error message to display.
         */
        function displayError(message) {
            errorDisplay.textContent = message;
            errorDisplay.style.display = 'block';
            resultsOutput.textContent = 'No data available.';
            dataControls.style.display = 'none';
            resultHeader.style.display = 'none';
            lastApiData = null;
        }

        /**
         * Handles copying the JSON data to the clipboard.
         */
        function copyData() {
            if (!lastApiData) {
                displayError("No data has been fetched yet to copy.");
                return;
            }
            const jsonString = JSON.stringify(lastApiData, null, 2);
            navigator.clipboard.writeText(jsonString)
                .then(() => {
                    alert('JSON data successfully copied to clipboard!');
                })
                .catch(err => {
                    console.error('Could not copy text: ', err);
                    alert('Failed to copy data. Check console for errors.');
                });
        }

        /**
         * Handles downloading the JSON data as a TXT file.
         */
        function downloadTxt() {
            if (!lastApiData) {
                displayError("No data has been fetched yet to download.");
                return;
            }

            // Convert JSON object to a nicely formatted string for TXT
            const content = JSON.stringify(lastApiData, null, 2);
            const blob = new Blob([content], { type: 'text/plain' });

            // Create a temporary download link
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `CyberNot_Lookup_${Date.now()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }


        // --- EVENT LISTENERS ---
        lookupBtn.addEventListener('click', fetchNumberInfo);
        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                fetchNumberInfo();
            }
        });
        copyBtn.addEventListener('click', copyData);
        downloadTxtBtn.addEventListener('click', downloadTxt);


        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            // If you were to implement logo dynamically:
            const logoImage = document.getElementById('logoPlaceholder');
            // If you provide a logo URL, replace 'placeholder.png' here:
            // logoImage.src = "YOUR_LOGO_URL_HERE"; 
        });

    </script>

</body>
</html>
